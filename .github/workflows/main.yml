name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          mkdir -p ~/.R
          LIBOMP=$(brew --prefix libomp)
          echo "PKG_CFLAGS=-Xclang -fopenmp -I${LIBOMP}/include" >> ~/.R/Makevars
          echo "PKG_LIBS=-L${LIBOMP}/lib -lomp" >> ~/.R/Makevars

      - name: debug
        if: runner.os == 'macOS'  
        run: |
          Rscript -e "
          library(geometria)
          set.seed(123)
          for(n in c(10, 50, 100, 200, 500, 1000)){
            cat('n =', n, '... ')
            tryCatch(
              { C.chull(runif(n), runif(n), 'graham', 'values'); cat('OK\n') },
              error = function(e) cat('FAIL:', conditionMessage(e), '\n')
            )
          }
          "

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::tinytest, any::roxygen2

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'